name: StdGram CI/CD

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyaes python-socks

      - name: Verify StdGram Package Imports
        run: |
          python -c "import stdgram; print('StdGram version:', stdgram.__version__)"
          python -c "import stdgram.enums; print('Enums OK')"
          python -c "import stdgram.errors; print('Errors OK')"
          python -c "import stdgram.raw; print('Raw MTProto OK')"
          python -c "from stdgram import Client; app = Client('ci_test'); print('Client initialized successfully!')"
