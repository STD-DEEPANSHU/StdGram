name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Verify installation and MTProto imports
        run: |
          python -c "import stdgram; print('StdGram:', stdgram.__version__)"
          python -c "from stdgram import Client, filters, enums; print('Client & filters OK')"
          python -c "import stdgram.raw; print('MTProto Layer schema OK')"
          python -c "from stdgram.errors import FloodWait; print('Errors OK')"
